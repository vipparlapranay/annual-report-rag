name: Fabric lakehouse validation

on:
  push:
    paths:
      - "fabric_lakehouse/**"
      - ".github/workflows/fabric-lakehouse.yml"
  pull_request:
    paths:
      - "fabric_lakehouse/**"
      - ".github/workflows/fabric-lakehouse.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fabric_lakehouse/pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -e ".[dev]"
        working-directory: fabric_lakehouse
      - run: python -m pytest -q
        working-directory: fabric_lakehouse
      - run: python -m fabric_lakehouse --generate-sample-data --sales-rows 5000
        working-directory: fabric_lakehouse
