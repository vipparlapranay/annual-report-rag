[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annual-report-rag"
version = "0.1.0"
description = "A citation-grounded API for answering questions about annual reports."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35,<2.0",
    "chromadb>=0.5,<2.0",
    "fastapi>=0.115,<1.0",
    "langgraph>=0.2,<1.0",
    "pypdf>=5.0,<6.0",
    "python-multipart>=0.0.12,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
