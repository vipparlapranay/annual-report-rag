[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-lakehouse-demo"
version = "0.1.0"
description = "Reproducible PySpark medallion lakehouse and star-schema demo."
requires-python = ">=3.10"
dependencies = [
    "delta-spark>=3.3,<3.4",
    "pyspark>=3.5,<3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fabric_lakehouse*"]
